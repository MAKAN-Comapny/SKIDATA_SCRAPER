name: SKIDATA Scraper

on:
  workflow_dispatch:
    # Allow manual trigger with flexible options
    inputs:
      mode:
        description: "Option to Run: 'daily' (Last 5 days -> Ski Data 5) or 'historical' (Month/Range -> Validated_Docs)"
        required: false
        default: "daily"
        type: choice
        options:
          - daily
          - historical
      month:
        description: "Historical Month: 'both', 'August', 'September', 'Jul', etc. (Used if mode=historical)"
        required: false
        default: "both"
      date_range:
        description: "Historical Date Range: e.g. '10-10-2026 to 23-10-2026' (Overrides month if set)"
        required: false
        default: ""
      days_count:
        description: "Daily Script: Number of rolling past days to fetch (default: 5)"
        required: false
        default: "5"
      target_date:
        description: "Daily Script: Specific single date (YYYY-MM-DD), leave empty for rolling days"
        required: false
        default: ""
  repository_dispatch:
    # Allows external triggers (e.g. cron-job.org) via GitHub API
    types: [manual-trigger]
  schedule:
    # Everyday at 05:00 UTC = 08:00 AM Saudi Time (AST)
    - cron: "0 5 * * *"

concurrency:
  group: skidata-scraper
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run SKIDATA pipeline
        env:
          HEADLESS: "true"
          TARGET_DATE: ${{ inputs.target_date }}
          DAYS_COUNT: ${{ inputs.days_count || '5' }}
          TARGET_FOLDER_PATH: "Ski Data 5"
          TARGET_FOLDER_PATH_ODOO: "Ski Data 5"
          SKIP_ODOO_EXPORT: "true"
          SKIDATA_URL: ${{ secrets.SKIDATA_URL }}
          SKIDATA_TENANT: ${{ secrets.SKIDATA_TENANT }}
          SKIDATA_LOGIN: ${{ secrets.SKIDATA_LOGIN }}
          SKIDATA_PASSWORD: ${{ secrets.SKIDATA_PASSWORD }}
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SHAREPOINT_SITE_NAME: ${{ secrets.SHAREPOINT_SITE_NAME }}
        run: |
          if [ "${{ inputs.mode }}" = "historical" ]; then
            echo "=========================================================="
            echo "RUNNING HISTORICAL / RANGE DATA SCRIPT"
            echo "Target SharePoint: Validated_Docs/old/"
            echo "=========================================================="
            if [ -n "${{ inputs.date_range }}" ]; then
              python main_backfill.py --range "${{ inputs.date_range }}" --headless
            else
              python main_backfill.py --month "${{ inputs.month || 'both' }}" --headless
            fi
          else
            echo "=========================================================="
            echo "RUNNING DAILY SCRIPT (Rolling past days -> Ski Data 5)"
            echo "=========================================================="
            python main.py
          fi
