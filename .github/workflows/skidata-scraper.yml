name: SKIDATA Scraper & 15-Day Reconciliation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Option to Run: 'reconcile' (15-day reconciliation), 'daily' (Run reconciliation & scraping), or 'historical'"
        required: false
        default: "reconcile"
        type: choice
        options:
          - reconcile
          - test-connection
          - daily
          - historical
          - scrape-only
      month:
        description: "Historical Month: 'both', 'August', 'September', 'Jul', etc. (Used if mode=historical)"
        required: false
        default: "both"
      date_range:
        description: "Historical Date Range: e.g. '10-10-2026 to 23-10-2026' (Overrides month if set)"
        required: false
        default: ""
      days_count:
        description: "Rolling past days to evaluate (default: 15)"
        required: false
        default: "15"
      target_date:
        description: "Target End Date (YYYY-MM-DD), leave blank for yesterday"
        required: false
        default: ""
      dry_run:
        description: "Dry run: Generate reconciliation report without sending email"
        required: false
        default: "false"

  repository_dispatch:
    # External cron (cron-job.org) trigger support
    types: [manual-trigger, reconcile-15days-trigger]

concurrency:
  group: skidata-scraper
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Microsoft ODBC Driver 18 for SQL Server
        run: |
          curl -sSL -O https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          rm -f packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyodbc pymssql msal azure-identity

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run Pipeline
        env:
          HEADLESS: "true"
          TARGET_DATE: ${{ inputs.target_date }}
          DAYS_COUNT: ${{ inputs.days_count || '15' }}
          TARGET_FOLDER_PATH: "Ski Data 5"
          TARGET_FOLDER_PATH_ODOO: "Ski Data 5"
          SKIP_ODOO_EXPORT: "true"
          SKIDATA_URL: ${{ secrets.SKIDATA_URL }}
          SKIDATA_TENANT: ${{ secrets.SKIDATA_TENANT }}
          SKIDATA_LOGIN: ${{ secrets.SKIDATA_LOGIN }}
          SKIDATA_PASSWORD: ${{ secrets.SKIDATA_PASSWORD }}
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SHAREPOINT_SITE_NAME: ${{ secrets.SHAREPOINT_SITE_NAME }}
          FABRIC_SCHEMA: "Skidata15"
          RECON_ALERT_RECIPIENTS: "sumit.dhankhar@makan.sa,karim.essam@makan.sa"
        run: |
          if [ "${{ inputs.mode }}" = "test-connection" ]; then
            echo "=========================================================="
            echo "QUICK PRE-FLIGHT TEST: FABRIC CONNECTION & SCHEMA INSPECTION"
            echo "=========================================================="
            python run_reconcile.py --test-connection
          elif [ "${{ inputs.mode }}" = "historical" ]; then
            echo "=========================================================="
            echo "RUNNING HISTORICAL / RANGE DATA SCRIPT"
            echo "Target SharePoint: Validated_Docs/old/"
            echo "=========================================================="
            if [ -n "${{ inputs.date_range }}" ]; then
              python main_backfill.py --range "${{ inputs.date_range }}" --headless
            else
              python main_backfill.py --month "${{ inputs.month || 'both' }}" --headless
            fi
          elif [ "${{ inputs.mode }}" = "scrape-only" ]; then
            echo "=========================================================="
            echo "RUNNING DAILY SCRAPER ONLY (Ski Data 5)"
            echo "=========================================================="
            python main.py
          else
            echo "=========================================================="
            echo "MAKAN PARKING: 15-DAY RECONCILIATION PIPELINE"
            echo "Branch: feat/reconcile_15days | Days: ${{ inputs.days_count || 15 }}"
            echo "Target Recipients: sumit.dhankhar@makan.sa, karim.essam@makan.sa"
            echo "=========================================================="
            
            ARGS="--fresh-scrape --days ${{ inputs.days_count || 15 }}"
            if [ -n "${{ inputs.target_date }}" ]; then
              ARGS="$ARGS --target-date ${{ inputs.target_date }}"
            fi
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              ARGS="$ARGS --dry-run"
            fi
            python run_reconcile.py $ARGS
          fi

      - name: Archive reconciliation reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reconciliation-audit-reports
          path: reconciliation_reports/
          retention-days: 30

      - name: Archive exports and pipeline artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skidata-run-artifacts
          path: |
            exports/
            Cleaned-Exports/
          retention-days: 7
