name: SKIDATA Scraper

on:
  schedule:
    # Run 1: 05:50 UTC = 08:50 AM Saudi Time (AST) / 11:20 AM IST (Production Daily)
    - cron: "50 5 * * *"
    # Run 2: 09:00 UTC = 12:00 PM (Noon) Saudi Time (AST) / 02:30 PM IST (Midday Refresh)
    - cron: "0 9 * * *"
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions tab
    inputs:
      target_date:
        description: "Day to export, YYYY-MM-DD. Leave empty for yesterday."
        required: false
        default: ""

concurrency:
  group: skidata-scraper
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run SKIDATA pipeline
        env:
          HEADLESS: "true"
          TARGET_DATE: ${{ inputs.target_date }}
          SKIDATA_URL: ${{ secrets.SKIDATA_URL }}
          SKIDATA_TENANT: ${{ secrets.SKIDATA_TENANT }}
          SKIDATA_LOGIN: ${{ secrets.SKIDATA_LOGIN }}
          SKIDATA_PASSWORD: ${{ secrets.SKIDATA_PASSWORD }}
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SHAREPOINT_SITE_NAME: ${{ secrets.SHAREPOINT_SITE_NAME }}
          TARGET_FOLDER_PATH: ${{ secrets.TARGET_FOLDER_PATH }}
        run: python main.py

      - name: Archive exports and pipeline artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skidata-run-artifacts
          path: |
            exports/
            Cleaned-Exports/
            Odoo-Exports/
          retention-days: 7
