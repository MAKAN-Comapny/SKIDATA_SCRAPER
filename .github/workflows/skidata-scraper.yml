name: SKIDATA Scraper

on:
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions tab
    inputs:
      target_date:
        description: "Day to export, YYYY-MM-DD. Leave empty for rolling window."
        required: false
        default: ""
      days_count:
        description: "Number of rolling days to export (default: 5)."
        required: false
        default: "5"
      target_folder:
        description: "Target SharePoint folder (default: Ski Data 5 for dev)."
        required: false
        default: "Ski Data 5"
  repository_dispatch:
    # Allows external triggers (e.g. cron-job.org) via GitHub API
    types: [manual-trigger]
  schedule:
    # Everyday at 05:00 UTC = 08:00 AM Saudi Time (AST)
    - cron: "0 5 * * *"

concurrency:
  group: skidata-scraper
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run SKIDATA pipeline
        env:
          HEADLESS: "true"
          TARGET_DATE: ${{ inputs.target_date }}
          DAYS_COUNT: ${{ inputs.days_count || '5' }}
          TARGET_FOLDER_PATH: ${{ inputs.target_folder || secrets.TARGET_FOLDER_PATH || 'Ski Data 5' }}
          TARGET_FOLDER_PATH_ODOO: ${{ inputs.target_folder || 'Ski Data 5' }}
          SKIP_ODOO_EXPORT: "true"
          SKIDATA_URL: ${{ secrets.SKIDATA_URL }}
          SKIDATA_TENANT: ${{ secrets.SKIDATA_TENANT }}
          SKIDATA_LOGIN: ${{ secrets.SKIDATA_LOGIN }}
          SKIDATA_PASSWORD: ${{ secrets.SKIDATA_PASSWORD }}
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SHAREPOINT_SITE_NAME: ${{ secrets.SHAREPOINT_SITE_NAME }}
        run: python main.py
