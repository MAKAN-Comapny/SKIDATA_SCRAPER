name: SKIDATA Scraper

on:
  # schedule:
  #   # Disabled in favor of reliable external cron-job.org triggers (avoids GitHub Actions queue delay)
  #   # Run 1: 05:50 UTC = 08:50 AM Saudi Time (AST) / 11:20 AM IST (Production Daily)
  #   - cron: "50 5 * * *"
  #   # Run 2: 09:00 UTC = 12:00 PM (Noon) Saudi Time (AST) / 02:30 PM IST (Midday Refresh)
  #   - cron: "0 9 * * *"

  # repository_dispatch:
  #   # PAUSED: Disabled so Yogesh cron-job.org triggers cannot call legacy 1-day scraper.
  #   # Scraping is now handled by the 15-day rolling scraper on feature/5-days-rolling.
  #   types: [manual-trigger]

  workflow_dispatch:
    # Allow manual trigger from GitHub Actions tab
    inputs:
      target_date:
        description: "Day to export, YYYY-MM-DD. Leave empty for yesterday."
        required: false
        default: ""

concurrency:
  group: skidata-scraper
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # PAUSED: Guardrail against unintentional manual triggers.
    if: false

    steps:
      - name: Pipeline Paused Guard
        run: |
          echo "=========================================================================="
          echo "PIPELINE PAUSED: Legacy 1-Day Scraper on 'main' is deactivated."
          echo "Scraping is now managed by the 15-day rolling pipeline on 'feature/5-days-rolling'."
          echo "=========================================================================="
          exit 0

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run SKIDATA pipeline
        env:
          HEADLESS: "true"
          TARGET_DATE: ${{ inputs.target_date }}
          SKIDATA_URL: ${{ secrets.SKIDATA_URL }}
          SKIDATA_TENANT: ${{ secrets.SKIDATA_TENANT }}
          SKIDATA_LOGIN: ${{ secrets.SKIDATA_LOGIN }}
          SKIDATA_PASSWORD: ${{ secrets.SKIDATA_PASSWORD }}
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SHAREPOINT_SITE_NAME: ${{ secrets.SHAREPOINT_SITE_NAME }}
          TARGET_FOLDER_PATH: ${{ secrets.TARGET_FOLDER_PATH }}
        run: python main.py

      - name: Archive exports and pipeline artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skidata-run-artifacts
          path: |
            exports/
            Cleaned-Exports/
            Odoo-Exports/
          retention-days: 7
