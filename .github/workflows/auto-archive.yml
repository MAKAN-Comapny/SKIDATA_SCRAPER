name: Automatic SharePoint File Archival

on:
  schedule:
    # Everyday at 16:00 UTC = 19:00 (7:00 PM) Riyadh / Saudi Time (AST)
    - cron: "0 16 * * *"
  workflow_dispatch:
    # Allows manual execution anytime with custom inputs
    inputs:
      source_folder:
        description: "Source SharePoint folder (e.g. Validated_Docs, Ski Data 5, SKIDATA - Odoo)"
        required: false
        default: "Validated_Docs"
      archive_root:
        description: "Target SharePoint archive directory (leave blank for <source_folder>/old)"
        required: false
        default: ""
      dry_run:
        description: "Dry run mode (scan & classify only, do not move files)"
        required: false
        type: boolean
        default: false
  repository_dispatch:
    # Allows external triggers (e.g. cron-job.org) via GitHub API
    types: [auto-archive-trigger, manual-trigger]

concurrency:
  group: auto-archive-sharepoint
  cancel-in-progress: false

jobs:
  archive-files:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run SharePoint File Archiver
        env:
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SHAREPOINT_SITE_NAME: ${{ secrets.SHAREPOINT_SITE_NAME }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ] || [ "${{ github.event.client_payload.dry_run }}" = "true" ]; then
            EXTRA_ARGS="--dry-run"
          fi
          SRC="${{ github.event.client_payload.source_folder || github.event.client_payload.folder || inputs.source_folder || 'Validated_Docs' }}"
          DEST="${{ github.event.client_payload.archive_root || github.event.client_payload.dest_root || inputs.archive_root || '' }}"
          if [ -z "$DEST" ]; then
            DEST="${SRC}/old"
          fi
          echo "=========================================================="
          echo "RUNNING SHAREPOINT ARCHIVER & FILE MOVER"
          echo "Source:       $SRC"
          echo "Archive Root: $DEST"
          echo "=========================================================="
          python archive_files.py \
            --source "$SRC" \
            --dest-root "$DEST" \
            $EXTRA_ARGS
