name: SKIDATA Historical Backfill Pipeline

on:
  workflow_dispatch:
    inputs:
      month:
        description: "Select Month to Backfill"
        type: choice
        options:
          - "both"
          - "august"
          - "september"
        default: "both"
      sheet:
        description: "Select Sheets to Export"
        type: choice
        options:
          - "all"
          - "parking"
          - "revenue"
          - "access"
          - "events"
        default: "all"

concurrency:
  group: skidata-backfill
  cancel-in-progress: false

jobs:
  run-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run Historical Backfill
        env:
          HEADLESS: "true"
          SKIDATA_URL: ${{ secrets.SKIDATA_URL }}
          SKIDATA_TENANT: ${{ secrets.SKIDATA_TENANT }}
          SKIDATA_LOGIN: ${{ secrets.SKIDATA_LOGIN }}
          SKIDATA_PASSWORD: ${{ secrets.SKIDATA_PASSWORD }}
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SHAREPOINT_SITE_NAME: ${{ secrets.SHAREPOINT_SITE_NAME }}
        run: python main_backfill.py --month "${{ inputs.month }}" --sheet "${{ inputs.sheet }}" --headless
